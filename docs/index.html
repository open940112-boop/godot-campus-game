html, body, #canvas {

	outline: none;

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;

#status-splash {
	max-height: 100%;
	max-width: 100%;

	display: none;
}

	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":5158916,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);const nativeFetch = window.fetch.bind(window);
window.fetch = async (resource, options) => {
	const requested = resource instanceof Request ? resource.url : String(resource);
	const file = new URL(requested, location.href).pathname.split('/').pop();
	const counts = { 'index.wasm': 14, 'index.pck': 2 };
	if (!(file in counts)) return nativeFetch(resource, options);
	const blobs = await Promise.all(Array.from({ length: counts[file] }, async (_, i) => {
		const part = `${file}.part${String(i).padStart(2, '0')}`;
		const response = await nativeFetch(part, options);
		if (!response.ok) throw new Error(`載入遊戲檔案失敗：${part}`);
		return response.blob();
	}));
	return new Response(new Blob(blobs), { headers: { 'Content-Type': file.endsWith('.wasm') ? 'application/wasm' : 'application/octet-stream' } });
};

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	let gameStarted = false;
	const landing = document.getElementById('landing');
	const loadingScreen = document.createElement('div');
	loadingScreen.className = 'loading';
	loadingScreen.innerHTML = '<div class="loading-mark">12</div><div class="loading-title">正在整理遊戲模組</div><div class="loading-copy">PLEASE WAIT · BUILDING YOUR SYSTEM</div><div class="progress-track"><progress id="loading-progress"></progress></div>';
	document.body.appendChild(loadingScreen);
	const loadingProgress = loadingScreen.querySelector('#loading-progress');
	function startGame() {
		if (gameStarted) return;
		gameStarted = true;
		document.body.classList.add('playing');
		landing.classList.add('is-leaving');
		loadingScreen.classList.add('is-visible');
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					loadingProgress.value = current;
					loadingProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					loadingProgress.removeAttribute('value');
					loadingProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			loadingScreen.remove();
			landing.remove();
		}, (err) => {
			loadingScreen.remove();
			displayFailureNotice(err);
		});
	}
	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			document.getElementById('start-button').addEventListener('click', () => displayFailureNotice(missingMsg + missing.join('\n')));
		}
	} else {
		document.getElementById('start-button').addEventListener('click', startGame);
	}
}());
